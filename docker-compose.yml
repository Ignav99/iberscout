version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iberscout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iberscout_db
      POSTGRES_USER: iberscout_user
      POSTGRES_PASSWORD: TIZ@voltio999
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iberscout_user -d iberscout_db"]
      interval: 10s
      timeout: 5s
      retries: 5
